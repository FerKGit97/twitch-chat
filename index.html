<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FerKLives - Pokémon Chat</title>
<style>
:root{
  --font:Arial,Helvetica,sans-serif;
  --text:#fff;
  --blue:#123b57;
  --blue-light:#1c5878;
  --blue-dark:#09283d;
  --gold:#e6c66a;
  --gold-light:#fff1ad;
  --gap:9px;
  --shadow:0 4px 12px rgba(0,18,30,.32);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#chat{
  width:100%;
  height:100%;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:var(--gap);
  font-family:var(--font);
  color:var(--text);
}

/* Cada mensaje funciona como una pequeña placa de interfaz Pokémon */
.message{
  position:relative;
  width:max-content;
  max-width:96%;
  animation:messageIn .28s cubic-bezier(.2,.8,.2,1);
  filter:drop-shadow(var(--shadow));
}
.name{
  display:inline-block;
  position:relative;
  z-index:2;
  margin:0 0 -2px 9px;
  padding:4px 12px 5px;
  border:1px solid var(--gold);
  border-bottom:0;
  border-radius:8px 8px 0 0;
  background:linear-gradient(180deg,var(--blue-light),var(--blue));
  color:var(--gold-light);
  font-size:14px;
  line-height:1;
  font-weight:800;
  text-shadow:0 1px 2px rgba(0,0,0,.65);
  box-shadow:inset 0 1px rgba(255,255,255,.14);
}
.body{
  position:relative;
  padding:9px 13px 10px;
  border:1px solid rgba(230,198,106,.9);
  border-radius:3px 11px 11px 11px;
  background:linear-gradient(135deg,rgba(18,59,87,.94),rgba(9,40,61,.91));
  color:var(--text);
  font-size:17px;
  line-height:1.32;
  overflow-wrap:anywhere;
  text-shadow:0 1px 2px rgba(0,0,0,.7);
  box-shadow:inset 0 1px rgba(255,255,255,.12);
}
.body:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:34px;
  height:1px;
  background:var(--gold-light);
  opacity:.8;
}
.body img.emote{
  height:25px;
  width:auto;
  vertical-align:middle;
  margin:-3px 1px;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));
}
@keyframes messageIn{
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:none}
}
.fade{animation:messageOut .35s ease forwards}
@keyframes messageOut{
  to{opacity:0;transform:translateY(-7px)}
}
.system{
  align-self:center;
  padding:4px 9px;
  border:1px solid rgba(230,198,106,.55);
  border-radius:7px;
  background:rgba(9,40,61,.72);
  color:rgba(255,241,173,.7);
  font-size:11px;
}
</style>
</head>
<body>
<div id="chat"></div>
<script>
const params=new URLSearchParams(location.search);
const channel=(params.get('channel')||'FerKLives').replace(/^#/,'').toLowerCase();
const maxMessages=Math.max(1,Math.min(50,parseInt(params.get('max')||'12',10)));
const lifetime=Math.max(0,parseInt(params.get('time')||'0',10));
const chat=document.getElementById('chat');

function addSystem(text){
  const el=document.createElement('div');
  el.className='system';
  el.textContent=text;
  chat.appendChild(el);
  while(chat.children.length>maxMessages)chat.firstChild.remove();
}
function escapeHtml(s){
  const d=document.createElement('div');
  d.textContent=s;
  return d.innerHTML;
}
function renderEmotes(text,emotes){
  if(!emotes)return escapeHtml(text);
  const ranges=[];
  for(const group of emotes.split('/')){
    const [id,positions]=group.split(':');
    if(!positions)continue;
    for(const range of positions.split(',')){
      const [a,b]=range.split('-').map(Number);
      ranges.push({a,b,id});
    }
  }
  ranges.sort((x,y)=>x.a-y.a);
  let out='',cursor=0;
  for(const r of ranges){
    if(r.a<cursor)continue;
    out+=escapeHtml(text.slice(cursor,r.a));
    const src='https://static-cdn.jtvnw.net/emoticons/v2/'+r.id+'/default/dark/2.0';
    out+='<img class="emote" alt="" src="'+src+'">';
    cursor=r.b+1;
  }
  return out+escapeHtml(text.slice(cursor));
}
function addMessage(user,color,text,emotes){
  const el=document.createElement('div');
  el.className='message';
  const safeColor=/^#[0-9a-fA-F]{6}$/.test(color||'')?color:'var(--gold-light)';
  el.innerHTML=
    '<div class="name" style="color:'+safeColor+'">'+escapeHtml(user)+'</div>'+
    '<div class="body">'+renderEmotes(text,emotes)+'</div>';
  chat.appendChild(el);
  while(chat.children.length>maxMessages)chat.firstChild.remove();
  if(lifetime){
    setTimeout(()=>{
      if(el.isConnected){
        el.classList.add('fade');
        setTimeout(()=>el.remove(),400);
      }
    },lifetime*1000);
  }
}
function parseTags(raw){
  const tags={};
  for(const item of raw.split(';')){
    const i=item.indexOf('=');
    if(i<0)tags[item]='';
    else tags[item.slice(0,i)]=item.slice(i+1).replace(/\\s/g,' ');
  }
  return tags;
}
function connect(){
  const ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen=()=>{
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands twitch.tv/membership');
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan'+Math.floor(Math.random()*999999));
    ws.send('JOIN #'+channel);
    addSystem('Chat conectado · '+channel);
  };
  ws.onmessage=e=>{
    for(const line of e.data.split('\r\n')){
      if(!line)continue;
      if(line.startsWith('PING ')){
        ws.send('PONG :tmi.twitch.tv');
        continue;
      }
      const match=line.match(/^@([^ ]+) +:([^!]+)!~[^ ]+ +PRIVMSG #[^ ]+ :([\s\S]*)$/);
      if(!match)continue;
      const tags=parseTags(match[1]);
      addMessage(tags['display-name']||match[2],tags.color,match[3],tags.emotes);
    }
  };
  ws.onclose=()=>{
    addSystem('Chat desconectado · reconectando...');
    setTimeout(connect,3000);
  };
  ws.onerror=()=>{};
}
connect();
</script>
</body>
</html>
