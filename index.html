<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FerKLives - Pokémon Chat</title>
<style>
:root{
  --font:Arial,Helvetica,sans-serif;
  --text:#fff;
  --blue:#123b57;
  --blue-light:#1c5878;
  --blue-dark:#09283d;
  --gold:#e6c66a;
  --gold-light:#fff1ad;
  --gap:9px;
  --shadow:0 4px 12px rgba(0,18,30,.32);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#chat{
  width:100%;
  height:100%;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:var(--gap);
  font-family:var(--font);
  color:var(--text);
}

/* Cada mensaje funciona como una pequeña placa de interfaz Pokémon */
.message{
  position:relative;
  width:max-content;
  max-width:96%;
  animation:messageIn .28s cubic-bezier(.2,.8,.2,1);
  filter:drop-shadow(var(--shadow));
}
.name{
  display:inline-block;
  position:relative;
  z-index:2;
  margin:0 0 -2px 9px;
  padding:4px 12px 5px;
  border:1px solid var(--gold);
  border-bottom:0;
  border-radius:8px 8px 0 0;
  background:linear-gradient(180deg,var(--blue-light),var(--blue));
  color:var(--gold-light);
  font-size:14px;
  line-height:1;
  font-weight:800;
  text-shadow:0 1px 2px rgba(0,0,0,.65);
  box-shadow:inset 0 1px rgba(255,255,255,.14);
}
.body{
  position:relative;
  padding:9px 13px 10px;
  border:1px solid rgba(230,198,106,.9);
  border-radius:3px 11px 11px 11px;
  background:linear-gradient(135deg,rgba(18,59,87,.94),rgba(9,40,61,.91));
  color:var(--text);
  font-size:17px;
  line-height:1.32;
  overflow-wrap:anywhere;
  text-shadow:0 1px 2px rgba(0,0,0,.7);
  box-shadow:inset 0 1px rgba(255,255,255,.12);
}
.body:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:34px;
  height:1px;
  background:var(--gold-light);
  opacity:.8;
}
.body img.emote{
  height:25px;
  width:auto;
  vertical-align:middle;
  margin:-3px 1px;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));
}
@keyframes messageIn{
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:none}
}
.fade{animation:messageOut .35s ease forwards}
@keyframes messageOut{
  to{opacity:0;transform:translateY(-7px)}
}
.system{
  align-self:center;
  padding:4px 9px;
  border:1px solid rgba(230,198,106,.55);
  border-radius:7px;
  background:rgba(9,40,61,.72);
  color:rgba(255,241,173,.7);
  font-size:11px;
}
</style>
</head>
<body>
<div id="chat"></div>
<script>
const params=new URLSearchParams(location.search);
const channel=(params.get('channel')||'FerKLives').replace(/^#/,'').toLowerCase();
const maxMessages=Math.max(1,Math.min(50,parseInt(params.get('max')||'12',10)));
const lifetime=Math.max(0,parseInt(params.get('time')||'0',10));
const chat=document.getElementById('chat');
const sevenTV=new Map();
let sevenTVRegex=null;

function addSystem(text){
  const el=document.createElement('div');
  el.className='system';
  el.textContent=text;
  chat.appendChild(el);
  while(chat.children.length>maxMessages)chat.firstChild.remove();
}
function escapeHtml(s){
  const d=document.createElement('div');
  d.textContent=s;
  return d.innerHTML;
}
function renderEmotes(text,emotes){
  const replacements=[];

  if(emotes){
    for(const group of emotes.split('/')){
      const [id,positions]=group.split(':');
      if(!positions)continue;
      for(const range of positions.split(',')){
        const [start,end]=range.split('-').map(Number);
        replacements.push({
          start,
          end:end+1,
          html:'<img class="emote" alt="" src="https://static-cdn.jtvnw.net/emoticons/v2/'+id+'/default/dark/2.0">'
        });
      }
    }
  }

  if(sevenTV.size){
    const parts=text.split(/(\\s+)/);
    let pos=0;
    for(const part of parts){
      if(part && !/^\\s+$/.test(part) && sevenTV.has(part)){
        replacements.push({
          start:pos,
          end:pos+part.length,
          html:'<img class="emote" alt="'+escapeHtml(part)+'" title="'+escapeHtml(part)+'" src="'+sevenTV.get(part)+'">'
        });
      }
      pos+=part.length;
    }
  }

  replacements.sort((x,y)=>x.start-y.start || y.end-x.end);
  let out='',cursor=0;
  for(const r of replacements){
    if(r.start<cursor)continue;
    out+=escapeHtml(text.slice(cursor,r.start));
    out+=r.html;
    cursor=r.end;
  }
  return out+escapeHtml(text.slice(cursor));
}
async function loadSevenTV(){
  const setUrls=(setId)=>[
    'https://api.7tv.app/v3/emote-sets/'+encodeURIComponent(setId),
    'https://7tv.io/v3/emote-sets/'+encodeURIComponent(setId)
  ];

  const addSet=async(setId)=>{
    if(!setId)return 0;
    for(const url of setUrls(setId)){
      try{
        const response=await fetch(url,{cache:'no-store'});
        if(!response.ok)continue;
        const data=await response.json();
        const list=Array.isArray(data?.emotes)?data.emotes:[];
        let added=0;
        for(const e of list){
          const id=e?.id||e?.data?.id||e?.emote?.id;
          const name=e?.name||e?.data?.name||e?.emote?.name||e?.alias;
          if(id&&name){
            sevenTV.set(name,'https://cdn.7tv.app/emote/'+id+'/3x.webp');
            added++;
          }
        }
        if(added)return added;
      }catch(err){
        console.warn('7TV set fetch failed:',url,err);
      }
    }
    return 0;
  };

  // Global 7TV emotes
  for(const url of [
    'https://api.7tv.app/v3/emote-sets/global',
    'https://7tv.io/v3/emote-sets/global'
  ]){
    try{
      const response=await fetch(url,{cache:'no-store'});
      if(!response.ok)continue;
      const data=await response.json();
      const list=Array.isArray(data?.emotes)?data.emotes:[];
      for(const e of list){
        const id=e?.id||e?.data?.id||e?.emote?.id;
        const name=e?.name||e?.data?.name||e?.emote?.name||e?.alias;
        if(id&&name)sevenTV.set(name,'https://cdn.7tv.app/emote/'+id+'/3x.webp');
      }
      if(sevenTV.size)break;
    }catch(err){
      console.warn('7TV global fetch failed:',url,err);
    }
  }

  // Channel 7TV emotes.
  // We know the 7TV user ID for FerKLives, so use it directly instead of
  // depending on DecAPI/Twitch ID resolution.
  const known7TVUserId='01KZW572HQWZRZBBZN5YM7EB71';
  try{
    const userUrls=[
      'https://7tv.io/v3/users/'+encodeURIComponent(known7TVUserId),
      'https://api.7tv.app/v3/users/'+encodeURIComponent(known7TVUserId)
    ];
    let userData=null;
    for(const url of userUrls){
      try{
        const response=await fetch(url,{cache:'no-store'});
        if(response.ok){
          userData=await response.json();
          console.info('7TV user loaded from:',url,userData);
          break;
        }
      }catch(err){
        console.warn('7TV user fetch failed:',url,err);
      }
    }

    if(userData){
      const setIds=new Set();

      // Current/legacy shapes.
      if(userData?.emote_set?.id)setIds.add(userData.emote_set.id);
      for(const s of (userData?.emote_sets||[])){
        if(s?.id)setIds.add(s.id);
      }

      // User connection shape: Twitch connection -> emote_set_id.
      for(const c of (userData?.connections||[])){
        if(c?.emote_set_id)setIds.add(c.emote_set_id);
        if(c?.emote_set?.id)setIds.add(c.emote_set.id);
      }

      console.info('7TV channel set IDs:',[...setIds]);

      for(const setId of setIds) await addSet(setId);
    }
  }catch(err){
    console.warn('7TV channel fetch failed:',err);
  }

  console.info('7TV emotes loaded:',sevenTV.size);

  if(sevenTV.size){
    sevenTVRegex=new RegExp('(^|\\s)('+[...sevenTV.keys()]
      .sort((a,b)=>b.length-a.length)
      .map(s=>s.replace(/[.*+?^$()|[\\\\]\\\\]/g,'\\\\$&'))
      .join('|')+')(?!\\S)','g');
  }
}

function addMessage(user,color,text,emotes){
  const el=document.createElement('div');
  el.className='message';
  const safeColor=/^#[0-9a-fA-F]{6}$/.test(color||'')?color:'var(--gold-light)';
  el.innerHTML=
    '<div class="name" style="color:'+safeColor+'">'+escapeHtml(user)+'</div>'+
    '<div class="body">'+renderEmotes(text,emotes)+'</div>';
  chat.appendChild(el);
  while(chat.children.length>maxMessages)chat.firstChild.remove();
  if(lifetime){
    setTimeout(()=>{
      if(el.isConnected){
        el.classList.add('fade');
        setTimeout(()=>el.remove(),400);
      }
    },lifetime*1000);
  }
}
function parseTags(raw){
  const tags={};
  for(const item of raw.split(';')){
    const i=item.indexOf('=');
    const key=i<0?item:item.slice(0,i);
    const value=i<0?'':item.slice(i+1);
    tags[key]=value.replace(/\\s/g,' ').replace(/\\n/g,'\n').replace(/\\:/g,':').replace(/\\\\/g,'\\');
  }
  return tags;
}
function parseIRC(line){
  let rest=line, tags={};
  if(rest.startsWith('@')){
    const space=rest.indexOf(' ');
    if(space===-1)return null;
    tags=parseTags(rest.slice(1,space));
    rest=rest.slice(space+1);
  }
  if(rest.startsWith(':')){
    const space=rest.indexOf(' ');
    if(space===-1)return null;
    rest=rest.slice(space+1);
  }
  const commandEnd=rest.indexOf(' ');
  const command=commandEnd===-1?rest:rest.slice(0,commandEnd);
  rest=commandEnd===-1?'':rest.slice(commandEnd+1);
  const params=[];
  while(rest){
    if(rest.startsWith(':')){params.push(rest.slice(1));break;}
    const space=rest.indexOf(' ');
    if(space===-1){params.push(rest);break;}
    params.push(rest.slice(0,space));
    rest=rest.slice(space+1).replace(/^ +/,'');
  }
  return {tags,command,params};
}
function connect(){
  const ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen=()=>{
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands twitch.tv/membership');
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan'+Math.floor(Math.random()*999999));
  };
  ws.onmessage=e=>{
    for(const line of e.data.split('\r\n')){
      if(!line)continue;
      if(line.startsWith('PING ')){
        ws.send('PONG :tmi.twitch.tv');
        continue;
      }
      const msg=parseIRC(line);
      if(!msg)continue;
      if(msg.command==='001'){
        ws.send('JOIN #'+channel);
        continue;
      }
      if(msg.command==='JOIN'){
        addSystem('Chat conectado · #'+channel);
        continue;
      }
      if(msg.command==='NOTICE'){
        addSystem('Twitch: '+(msg.params[msg.params.length-1]||'Error'));
        continue;
      }
      if(msg.command!=='PRIVMSG' || msg.params.length<2)continue;
      const text=msg.params[msg.params.length-1];
      const user=msg.tags['display-name']||msg.tags['login']||'Twitch';
      addMessage(user,msg.tags.color,text,msg.tags.emotes);
    }
  };
  ws.onclose=()=>{
    addSystem('Chat desconectado · reconectando...');
    setTimeout(connect,3000);
  };
  ws.onerror=()=>{};
}
loadSevenTV().finally(connect);
</script>
</body>
</html>
